<html lang="zh-CN"><head><meta charset="UTF-8"><title>Application assistant — synthetic IPC only</title></head>
<body><div id="app"></div><script type="module">
import { createApp, reactive, h } from "vue";
import ApplicationAssistantPage from "/src/features/application-assistant/components/ApplicationAssistantPage.vue";
import NotificationCenter from "/src/shared/components/NotificationCenter.vue";
import { clearNotifications } from "/src/shared/state/notifications.ts";
import { messages } from "/src/shared/i18n/index.ts";
import { applyTheme } from "/src/shared/theme/palette.ts";
import "/src/shared/styles/index.css";
import "/src/shared/theme/palettes.css";
const apps = [
  { pid: 42, applicationId: "code", displayName: "Visual Studio Code", processName: "Code.exe", executablePath: "C:\\Apps\\Code.exe", iconAvailable: false },
  { pid: 43, applicationId: "chat", displayName: "Chat", processName: "Chat.exe", executablePath: "C:\\Apps\\Chat.exe", iconAvailable: false }
];
const candidate = { id: "proxy", clientName: "v2rayN", host: "::1", port: 10808, protocol: "mixed", listening: true };
const state = reactive({ locale: "zh-CN", active: { selectedCandidateId: "proxy", candidate, available: true, selectionSource: "user", revision: 1 }, environment: { state:"enabled", matchesActiveProxy:true, entries:[{name:"HTTP_PROXY",exists:true,value:"http://[::1]:10808"}] }, stale:false, back: false, failList: false, failLaunch: false, expired: false, holdRenew: false, picked: false });
const calls = [];
function managed(id) { const app = apps.find(app => app.applicationId === id); return { id, displayName: app.displayName, executablePath: app.executablePath, iconKey: null, ruleId: null, lastAction: null }; }
window.fixture = { state, calls, clearNotices: clearNotifications, theme: (palette, mode) => applyTheme(document.documentElement, mode, palette, mode === "dark") };
window.__TAURI_INTERNALS__ = { invoke: async (command, args) => {
  calls.push([command, args]);
  if (command === "list_running_applications") {
    if (state.failList) throw Error("Synthetic list failure");
    return apps;
  }
  if (command === "renew_application_authorization") {
    if (state.holdRenew) await new Promise(resolve => { fixture.releaseRenew = resolve; });
    if (state.expired) throw Error("application authorization is missing or expired");
    return managed(args.applicationId);
  }
  if (command === "launch_application_with_current_proxy") {
    if (state.failLaunch) throw Error("Synthetic launch failure");
    return { pid: 99 };

} };
createApp({ setup() { return () => h("div", { class: "app-frame" }, [h(ApplicationAssistantPage, {
  copy: messages[state.locale], activeProxyContext: state.active, environment:state.environment, stale:state.stale,
  onBackLocal: () => { state.back = true; }
}), h(NotificationCenter, { closeLabel: messages[state.locale].closeWindow })]); } }).mount("#app");
</script></body></html>
