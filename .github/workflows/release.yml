name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw -LiteralPath 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $cargoVersionMatch = [regex]::Match((Get-Content -Raw -LiteralPath 'src-tauri/Cargo.toml'), '(?m)^version\s*=\s*"([^"]+)"')
          $cargoVersion = $cargoVersionMatch.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must contain a semantic version"
          }
          if ($packageVersion -ne $version -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw "Release tag, package.json, Cargo.toml, and tauri.conf.json versions must match"
          }
          $releaseNotesPath = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "A reviewed release-notes file is required at $releaseNotesPath"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0

      - name: Validate localized release notes
        run: node scripts/validate-release-notes.mjs .github/release-notes/${{ github.ref_name }}.md

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Install frontend dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      - name: Build frontend
        run: pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests with locked dependencies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy with locked dependencies
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # No Authenticode certificate, thumbprint, PFX, or sign command is configured.
      # Tauri Updater signatures remain mandatory and use the dedicated secret below.
      - name: Build Tauri bundles and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for every automatic-update release'
          }
          pnpm run release:build

      - name: Collect release artifacts and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $output = Join-Path $PWD 'release-artifacts'
          New-Item -ItemType Directory -Path $output | Out-Null

          $portable = Resolve-Path -LiteralPath 'src-tauri/target/release/proxyenv.exe'
          Copy-Item -LiteralPath $portable -Destination (Join-Path $output "ProxyEnv-$version-windows-x64-portable.exe")

          $installers = @()
          foreach ($directory in @(
            'src-tauri/target/release/bundle/nsis',
            'src-tauri/target/release/bundle/msi'
          )) {
            if (Test-Path -LiteralPath $directory) {
              $installers += Get-ChildItem -LiteralPath $directory -File | Where-Object {
                $_.Extension -in @('.exe', '.msi')
              }
            }
          }
          if ($installers.Count -eq 0) {
            throw 'Tauri did not produce an NSIS or MSI installer'
          }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination $output
            $signaturePath = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
              throw "Missing Tauri Updater signature for $($installer.Name)"
            }
            Copy-Item -LiteralPath $signaturePath -Destination $output
          }

          $nsisInstaller = $installers | Where-Object {
            $_.Extension -eq '.exe' -and $_.DirectoryName -like '*\bundle\nsis'
          } | Select-Object -First 1
          if (-not $nsisInstaller) {
            throw 'The signed NSIS installer required by the Windows updater is missing'
          }
          $nsisSignature = (Get-Content -Raw -LiteralPath "$($nsisInstaller.FullName).sig").Trim()
          if (-not $nsisSignature) {
            throw 'The NSIS updater signature is empty'
          }
          $releaseNotesPath = ".github/release-notes/$env:GITHUB_REF_NAME.md"
          $latest = [ordered]@{
            version = $version
            notes = Get-Content -Raw -LiteralPath $releaseNotesPath
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $nsisSignature
                url = "https://github.com/GKNEETIEMAY/ProxyEnv/releases/download/$env:GITHUB_REF_NAME/$($nsisInstaller.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'latest.json') -Encoding utf8NoBOM

          $checksumLines = Get-ChildItem -LiteralPath $output -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksumLines | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding utf8NoBOM

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: "release-artifacts/*"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyEnv-${{ github.ref_name }}-windows-x64
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: release-artifacts/*
